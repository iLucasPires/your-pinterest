services:

  # ── Application ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youpinterest_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
    networks:
      - youpinterest
    depends_on:
      - db
      - redis

  # ── Web server ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: youpinterest_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - youpinterest
    depends_on:
      - app

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: youpinterest_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-youpinterest}
      POSTGRES_USER: ${DB_USERNAME:-youpinterest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - youpinterest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-youpinterest}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: youpinterest_redis
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - youpinterest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Queue worker ───────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youpinterest_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    networks:
      - youpinterest
    depends_on:
      - db
      - redis

volumes:
  db_data:
  redis_data:

networks:
  youpinterest:
    driver: bridge
